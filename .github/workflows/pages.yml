name: Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  installers-ready:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check latest release installer assets
        id: check
        shell: bash
        run: |
          ready=true
          for asset in install.sh install.ps1; do
            status=$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "https://github.com/JobiJoba/Placard/releases/latest/download/$asset")
            case "$status" in
              200) ;;
              404) ready=false ;;
              *) echo "Unexpected HTTP $status checking $asset" >&2; exit 1 ;;
            esac
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then
            echo 'Installer assets are not published yet; keeping the existing website.' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: installers-ready
    if: needs.installers-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          # placard.fyi is a custom domain, so GitHub Pages serves the site from
          # the root. The project URL (jobijoba.github.io/Placard/) redirects to
          # the custom domain, so assets must be built with base "/" — building
          # with "/Placard/" makes every asset 404 on the custom domain.
          BASE_PATH: /
        run: pnpm --filter @placard/site build

      - name: SPA fallback for GitHub Pages
        run: |
          touch apps/site/dist/.nojekyll
          cp apps/site/dist/index.html apps/site/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
