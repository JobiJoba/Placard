name: Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  installers-ready:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check latest release installer assets
        id: check
        shell: bash
        run: |
          missing=()
          for asset in install.sh install.ps1 docker-compose.yml example.env docker-compose.override.yml Caddyfile; do
            for attempt in 1 2 3; do
              status=$(curl --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 60 --output /dev/null --write-out '%{http_code}' "https://github.com/JobiJoba/Placard/releases/latest/download/$asset")
              [ "$status" = 200 ] && break
              if [ "$attempt" -lt 3 ]; then sleep 10; fi
            done
            if [ "$status" != 200 ]; then
              echo "::error::Installer asset $asset returned HTTP $status after 3 attempts"
              missing+=("$asset (HTTP $status)")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing installer assets: %s\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  build:
    needs: installers-ready
    runs-on: ubuntu-latest
    steps:
      # workflow_run uses the trusted default-branch site, never release artifacts.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build site
        env:
          # placard.fyi is a custom domain, so GitHub Pages serves the site from
          # the root. The project URL (jobijoba.github.io/Placard/) redirects to
          # the custom domain, so assets must be built with base "/" — building
          # with "/Placard/" makes every asset 404 on the custom domain.
          BASE_PATH: /
        run: pnpm --filter @placard/site build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
