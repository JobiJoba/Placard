name: Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  installers-ready:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      # Check publication through the API, rather than the download CDN. A transient
      # CDN timeout must not block docs when the release assets are already uploaded.
      - name: Check published release assets
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_file=$(mktemp)
          trap 'rm -f "$release_file"' EXIT
          for attempt in 1 2 3; do
            if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$release_file"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Cannot verify the latest release through the GitHub API"
              exit 1
            fi
            sleep 10
          done
          jq -e '.draft == false and .prerelease == false and (.assets | type == "array")' "$release_file" > /dev/null
          missing=()
          for asset in install.sh install.ps1 docker-compose.yml example.env docker-compose.override.yml Caddyfile placard-recovery.py; do
            if ! jq -e --arg name "$asset" '.assets | any(.name == $name and .state == "uploaded" and .size > 0)' "$release_file" > /dev/null; then
              echo "::error::Latest release is missing a completed, non-empty asset: $asset"
              missing+=("$asset")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing release assets: %s\n' "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          tag=$(jq -r '.tag_name' "$release_file")
          printf 'Verified published release %s: all required install and recovery assets are uploaded.\n' "$tag" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: installers-ready
    runs-on: ubuntu-latest
    steps:
      # workflow_run uses the trusted default-branch site, never release artifacts.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Fetch verified published installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/site/scripts/fetch-installers.mjs

      - name: Build site
        env:
          # placard.fyi is a custom domain, so GitHub Pages serves the site from
          # the root. The project URL (placard-app.github.io/core/) redirects to
          # the custom domain, so assets must be built with base "/" — building
          # with "/core/" makes every asset 404 on the custom domain.
          BASE_PATH: /
        run: pnpm --filter @placard/site build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
