name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate release commit
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  publish:
    name: Publish image + install assets
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/placard" >> "$GITHUB_OUTPUT"

      # Stable releases only (git tags v*). Nightly tip of main is CI → :nightly (never :latest).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PLACARD_VERSION=${{ github.ref_name }}
            PLACARD_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=placard-image
            type=gha,scope=placard-check
          cache-to: type=gha,scope=placard-image,mode=max

      - name: Prepare install assets
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node scripts/prepare-release-assets.mjs "${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist-release/docker-compose.yml
            dist-release/docker-compose.override.yml
            dist-release/Caddyfile
            dist-release/example.env
            dist-release/placard-recovery.py

      # API download URLs exist only after the configuration assets are uploaded.
      # Publish installers last, embedding those exact assets as download fallbacks.
      - name: Publish installers with API fallback URLs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          export PLACARD_RELEASE_METADATA="$RUNNER_TEMP/placard-release.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$PLACARD_RELEASE_METADATA"
          node scripts/prepare-release-assets.mjs "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist-release/install.sh dist-release/install.ps1 --clobber
